<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="一款轻量、私密的浏览器端 Markdown 编辑与预览工具" />
  <title>Lumen · Markdown 编辑器</title>
  <link rel="stylesheet" href="assets/katex/katex.min.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <div class="window-bar">
      <div class="window-brand"><span class="window-mark">L</span><span class="window-title">Lumen</span></div>
      <div class="window-controls" aria-label="窗口控制">
        <button id="minimizeButton" type="button" aria-label="最小化">−</button>
        <button id="maximizeButton" type="button" aria-label="最大化或还原">□</button>
        <button id="closeButton" class="close-window" type="button" aria-label="关闭窗口">×</button>
      </div>
    </div>
    <header class="topbar">
      <div class="brand" aria-label="Lumen Markdown 编辑器">
        <span class="brand-mark">M<span>↓</span></span>
        <span>Lumen</span>
        <span class="brand-subtitle">Markdown Workspace</span>
      </div>
      <div class="document-name" id="documentName" title="点击重命名" tabindex="0">未命名文档.md</div>
      <div class="actions">
        <button class="button secondary theme-button" id="themeButton" type="button" title="切换 Dawn Light / Midnight Glow" aria-label="切换主题">☼</button>
        <button class="button secondary" id="newDocumentButton" type="button" title="新建文档 (Ctrl+N)">
          <span aria-hidden="true">＋</span> 新建文档
        </button>
        <input id="fileInput" type="file" accept=".md,.markdown,text/markdown,text/plain" multiple hidden />
        <button class="button secondary" id="uploadButton" type="button">
          <span aria-hidden="true">↥</span> 打开文档
        </button>
        <button class="button primary" id="downloadButton" type="button">
          <span aria-hidden="true">↓</span> 导出 .md
        </button>
      </div>
    </header>

    <main class="workspace" id="dropZone">
      <aside class="outline-sidebar" id="outlineSidebar" aria-label="文档大纲" hidden>
        <div class="outline-heading"><span>文档大纲</span><button class="icon-button" id="closeOutlineButton" type="button" title="收起大纲" aria-label="收起大纲">×</button></div>
        <div class="outline-summary" id="outlineSummary">当前文档</div>
        <nav class="outline-list" id="outlineList" aria-label="章节导航"></nav>
        <div class="outline-bottom"><span class="local-dot" aria-hidden="true"></span>本地工作空间<span>Lumen</span></div>
      </aside>
      <section class="pane document-pane" id="documentPanel" role="tabpanel" aria-label="Markdown 编辑与预览面板">
        <div class="document-tabs-bar">
          <div class="document-tabs" id="documentTabs" role="tablist" aria-label="打开的文档"></div>
          <button class="reopen-document-button" id="reopenDocumentButton" type="button" title="恢复最近关闭的文档 (Ctrl+Shift+T)" disabled>↶ 恢复关闭</button>
          <span class="document-count" id="documentCount" aria-live="polite">1 个文档</span>
        </div>
        <div class="pane-header">
          <div class="mode-switch" role="tablist" aria-label="视图模式">
            <button class="mode-button" id="editModeButton" type="button" role="tab" aria-selected="false" aria-controls="editorView">
              <span aria-hidden="true">✎</span> 编辑
            </button>
            <button class="mode-button active" id="previewModeButton" type="button" role="tab" aria-selected="true" aria-controls="previewView">
              <span aria-hidden="true">◉</span> 预览
            </button>
            <button class="mode-button" id="splitModeButton" type="button" role="tab" aria-selected="false" aria-controls="editorView previewView">
              <span aria-hidden="true">◫</span> 并列
            </button>
          </div>
          <div class="header-tools">
            <button class="icon-button" id="outlineButton" type="button" title="显示文档大纲" aria-label="切换文档大纲" aria-controls="outlineSidebar" aria-expanded="false">☷</button>
            <button class="reading-width-button" id="readingWidthButton" type="button" title="切换宽页阅读" aria-pressed="true">⤢ 宽页</button>
            <div class="toolbar" id="editorToolbar" aria-label="编辑工具栏" hidden>
              <button data-wrap="**" title="粗体 (Ctrl+B)"><b>B</b></button>
              <button data-wrap="*" title="斜体 (Ctrl+I)"><i>I</i></button>
              <button data-prefix="## " title="标题">H</button>
              <button data-prefix="> " title="引用">❞</button>
              <button data-wrap="`" title="行内代码">&lt;/&gt;</button>
              <button data-prefix="- " title="无序列表">☷</button>
              <button data-prefix="1. " title="有序列表">1.</button>
              <button id="insertImageButton" type="button" title="插入图片" aria-label="插入图片">▧</button>
              <input id="imageInput" type="file" accept="image/png,image/jpeg,image/gif,image/webp,image/avif,image/bmp,image/svg+xml" hidden />
            </div>
            <button class="icon-button copy-button" id="copyHtmlButton" type="button" title="复制 HTML">⧉</button>
            <button class="icon-button" id="findButton" type="button" title="查找与替换 (Ctrl+F / Ctrl+H)" aria-label="查找与替换" aria-controls="searchPanel" aria-expanded="false">⌕</button>
          </div>
        </div>
        <div class="external-change-notice" id="externalChangeNotice" role="status" hidden>
          <span id="externalChangeMessage"></span>
          <div class="external-change-actions">
            <button class="search-action" id="reloadExternalButton" type="button">载入外部版本</button>
            <button class="search-action" id="keepLocalButton" type="button">保留当前草稿</button>
          </div>
        </div>
        <section class="search-panel" id="searchPanel" aria-label="查找与替换" hidden>
          <div class="search-row">
            <button class="icon-button" id="toggleReplaceButton" type="button" title="展开替换" aria-label="展开替换" aria-controls="replaceRow" aria-expanded="false">›</button>
            <input class="search-input" id="searchInput" type="text" aria-label="查找文本" aria-describedby="searchStatus" placeholder="查找当前文档…" autocomplete="off" spellcheck="false" />
            <span class="search-status" id="searchStatus" role="status" aria-live="polite" aria-atomic="true">输入要查找的文本</span>
            <label class="match-case" title="区分大小写"><input id="matchCaseInput" type="checkbox" aria-label="区分大小写" />Aa</label>
            <button class="icon-button" id="previousMatchButton" type="button" title="上一个 (Shift+Enter)" aria-label="上一个匹配" disabled>↑</button>
            <button class="icon-button" id="nextMatchButton" type="button" title="下一个 (Enter)" aria-label="下一个匹配" disabled>↓</button>
            <button class="icon-button" id="closeSearchButton" type="button" title="关闭搜索 (Esc)" aria-label="关闭搜索">×</button>
          </div>
          <div class="search-row replace-row" id="replaceRow" hidden>
            <input class="search-input" id="replaceInput" type="text" aria-label="替换文本" placeholder="替换为…（留空表示删除）" autocomplete="off" spellcheck="false" />
            <button class="search-action" id="replaceButton" type="button" title="替换当前匹配 (Enter)" disabled>替换</button>
            <button class="search-action" id="replaceAllButton" type="button" disabled>全部替换</button>
          </div>
        </section>
        <div class="view-container">
          <div class="view" id="editorView" role="tabpanel" aria-labelledby="editModeButton" hidden>
            <div class="editor-wrap">
              <div class="line-numbers" id="lineNumbers" aria-hidden="true">1</div>
              <textarea id="editor" spellcheck="false" aria-label="Markdown 内容" placeholder="输入 Markdown，或从工具栏插入图片…"></textarea>
              <div class="search-highlights" id="searchHighlights" aria-hidden="true" hidden><div id="searchHighlightContent"></div></div>
            </div>
          </div>
          <div class="view active" id="previewView" role="tabpanel" aria-labelledby="previewModeButton">
            <article class="markdown-body" id="preview" tabindex="0" aria-label="Markdown 预览正文"></article>
          </div>
        </div>
        <footer class="pane-footer" id="documentFooter">
          <span id="saveStatus">已自动保存</span>
          <button class="footer-button" id="defaultAppButton" type="button" hidden>设置为默认打开方式</button>
          <span><b id="wordCount">0</b> 字符 · <b id="lineCount">1</b> 行 · 读取编码：<select id="encodingSelect" title="按所选编码重新读取文件" aria-label="修改读取编码">
            <option value="utf-8">UTF-8</option>
            <option value="gb18030">GB18030</option>
            <option value="gbk">GBK</option>
            <option value="utf-16le">UTF-16 LE</option>
            <option value="utf-16be">UTF-16 BE</option>
          </select></span>
        </footer>
      </section>

      <div class="drop-overlay" id="dropOverlay">
        <div><span>↥</span><strong>松开以打开 Markdown 文档</strong><small>支持 .md 和 .markdown</small></div>
      </div>
    </main>
  </div>
  <dialog class="table-dialog" id="tableDialog" aria-labelledby="tableDialogTitle" aria-describedby="tableDialogDescription">
    <header class="table-dialog-header">
      <div><span class="table-dialog-kicker">TABLE VIEW</span><h2 id="tableDialogTitle">表格视图</h2><p id="tableDialogDescription"></p></div>
      <button class="dialog-close-button" id="closeTableDialogButton" type="button" aria-label="关闭表格视图">关闭 <kbd>Esc</kbd></button>
    </header>
    <div class="table-dialog-content markdown-body" id="tableDialogContent" tabindex="0" aria-label="展开的表格，支持横向和纵向滚动"></div>
    <footer class="table-dialog-footer">完整显示所有列，内容较多时可横向滚动。<span>滚动查看 · Esc 返回文档</span></footer>
  </dialog>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="assets/flowchart.js"></script>
  <script src="assets/mermaid.min.js"></script>
  <script src="assets/marked.umd.js"></script>
  <script src="assets/purify.min.js"></script>
  <script src="assets/katex/katex.min.js"></script>
  <script src="assets/highlight.js"></script>
  <script src="markdown-renderer.js"></script>
  <script src="app.js"></script>
</body>
</html>
